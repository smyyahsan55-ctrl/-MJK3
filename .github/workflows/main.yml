name: Run Rubika Bot

on:
  schedule:
    - cron: '*/15 * * * *' # هر ۱۵ دقیقه برای اینکه همیشه زنده بمونه
  workflow_dispatch: 

jobs:
  bot-job:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install maxrubika aiosqlite

      - name: 🚀 Start Bot
        run: python "ربات‌ساز(1).py"
