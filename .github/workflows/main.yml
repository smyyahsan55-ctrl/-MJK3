name: Run Rubika Bot

on:
  workflow_dispatch: # این باعث میشه دکمه Run دستی برات ظاهر بشه
  schedule:
    - cron: '*/15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maxrubika aiosqlite

      - name: 🚀 Run Bot
        run: python "bot.py"
