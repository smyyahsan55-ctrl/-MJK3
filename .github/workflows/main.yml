name: Run Rubika Bot

on:
  schedule:
    - cron: '*/30 * * * *' # هر ۳۰ دقیقه یکبار چک می‌کنه که ربات زنده باشه
  workflow_dispatch: # اجازه می‌ده که دستی هم اجراش کنی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maxrubika aiosqlite

    - name: Run Bot
      run: python "bot.py"
